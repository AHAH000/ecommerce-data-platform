version: 2

models:
  - name: dim_customers
    columns:
      - name: customer_id
        data_tests: [unique, not_null]

  - name: dim_sellers
    columns:
      - name: seller_id
        data_tests: [unique, not_null]

  - name: dim_products
    columns:
      - name: product_id
        data_tests: [unique, not_null]

  - name: dim_date
    columns:
      - name: date_day
        data_tests: [unique, not_null]

  - name: fact_orders
    columns:
      - name: order_id
        data_tests: [unique, not_null]
      - name: customer_id
        data_tests:
          - relationships:
              to: ref('dim_customers')
              field: customer_id
      - name: purchase_date
        data_tests:
          - relationships:
              to: ref('dim_date')
              field: date_day

  - name: fact_order_items
    columns:
      - name: order_item_key
        data_tests: [unique, not_null]
      - name: product_id
        data_tests:
          - relationships:
              to: ref('dim_products')
              field: product_id
      - name: seller_id
        data_tests:
          - relationships:
              to: ref('dim_sellers')
              field: seller_id
